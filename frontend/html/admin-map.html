<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Admin Marine Map · MarineWatch</title>

<link rel="icon" href="favicon.ico">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">

<link href="../css/style.css" rel="stylesheet">
<link href="../css/dashboard.css" rel="stylesheet">
<link href="../css/map.css" rel="stylesheet">
<link href="../css/responsive.css" rel="stylesheet">

</head>

<body data-sb="map">

<div class="app-shell">

    <!-- Admin Sidebar -->
    <div data-include="components/sidebar-admin.html"></div>

    <!-- main content -->
    <main class="main">

        <!-- ===========================
             PAGE HEADER
        ============================ -->

        <div class="topbar">

            <button class="menu-toggle">
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="page-heading">

                <h1 class="page-title">
                    Marine Map
                </h1>

                <p class="page-subtitle">
                    Review Pending Pollution Reports
                </p>

            </div>

            <!-- Filled automatically by admin-map.js -->
            <div id="mapActions"></div>

        </div>

        <!-- ===========================
             PAGE CONTENT
        ============================ -->

        <div class="page-content">

            <div class="map-layout">

                <!-- ===========================
                     LEFT FILTERS
                ============================ -->

                <!-- sidebar -->
                <aside class="map-sidebar">

                    <div class="panel">

                        <div class="search-box">

                            <i class="fa-solid fa-search"></i>

                            <input
                                id="searchInput"
                                type="text"
                                placeholder="Search location...">

                        </div>

                        <h5>Filter by Severity</h5>

                        <div class="filter-grid">

                            <button class="filter-btn active" data-filter="all">
                                All
                            </button>

                            <button class="filter-btn" data-filter="high">
                                High
                            </button>

                            <button class="filter-btn" data-filter="medium">
                                Medium
                            </button>

                            <button class="filter-btn" data-filter="low">
                                Low
                            </button>

                        </div>

                        <hr>

                        <h5>Pollution Type</h5>

                        <select
                            id="typeFilter"
                            class="form-select">

                            <option value="">All Types</option>
                            <option>Plastic</option>
                            <option>Oil</option>
                            <option>Chemical</option>
                            <option>Fishing Gear</option>
                            <option>Debris</option>
                            <option>Coral Bleaching</option>
                            <option>Sewage</option>

                        </select>

                    </div>

                </aside>

                <!-- ===========================
                     RIGHT SIDE
                ============================ -->

                <div class="map-content">


                    <!-- Map -->

                    <!-- section -->
                    <section class="map-container">

                        <!-- marine map -->
                        <div id="marineMap"></div>

                    </section>

                </div>

            </div>

        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="../js/main.js"></script>
<script src="../js/dashboard.js"></script>
<script src="../js/admin-map.js"></script>

</body>
</html>
