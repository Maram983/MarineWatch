<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Marine Map · MarineWatch</title>

<link rel="icon" href="favicon.ico">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
<link href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" rel="stylesheet">
<link href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" rel="stylesheet">

<link href="../css/style.css" rel="stylesheet">
<link href="../css/dashboard.css" rel="stylesheet">
<link href="../css/map.css" rel="stylesheet">
<link href="../css/responsive.css" rel="stylesheet">

</head>

<body data-sb="map">

<div class="app-shell">

    <div data-include="components/sidebar-auto.html"></div>

    <!-- main content -->
    <main class="main">

        <!-- ===========================
             PAGE HEADER
        ============================ -->

        <div class="topbar">

            <button class="menu-toggle">

                <i class="fa-solid fa-bars"></i>

            </button>

            <div class="page-heading">

                <h1 class="page-title">

                    Marine Map

                </h1>

                <p class="page-subtitle">

                    Live Environmental Monitoring

                </p>

            </div>

            <!-- map actions -->
            <div id="mapActions"></div>

        </div>

        <!-- ===========================
             PAGE CONTENT
        ============================ -->

        <div class="page-content">

            <div class="map-layout">

                <!-- LEFT FILTERS -->

                <!-- sidebar -->
                <aside class="map-sidebar">

                    <div class="panel">

                        <div class="search-box">

                            <i class="fa-solid fa-search"></i>

                            <input
                                id="searchInput"
                                type="text"
                                placeholder="Search location...">

                        </div>

                        <h5>Filter by Severity</h5>

                        <div class="filter-grid">

                            <button class="filter-btn active" data-filter="all">

                                All

                            </button>

                            <button class="filter-btn" data-filter="high">

                                High

                            </button>

                            <button class="filter-btn" data-filter="medium">

                                Medium

                            </button>

                            <button class="filter-btn" data-filter="low">

                                Low

                            </button>

                        </div>

                        <hr>

                    </div>

                </aside>

                <!-- RIGHT SIDE -->

                <div class="map-content">

                    <!-- MAP -->

                    <!-- section -->
                    <section class="map-container">

                        <!-- marine map -->
                        <div id="marineMap"></div>

                    </section>

                    <!-- DETAILS -->

                   
                </div>

            </div>

        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script src="../js/main.js"></script>
<script src="../js/dashboard.js"></script>
<script src="../js/map.js"></script>

</body>
</html>
