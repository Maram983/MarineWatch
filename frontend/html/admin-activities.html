<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage activities · MarineWatch</title>
  <link rel="icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet"><link href="../css/dashboard.css" rel="stylesheet"><link href="../css/admin.css" rel="stylesheet"><link href="../css/reports.css" rel="stylesheet"><link href="../css/responsive.css" rel="stylesheet">
</head>
<body data-sb="activities">
  <div class="app-shell">
    <div data-include="components/sidebar-admin.html"></div>
    <!-- main content -->
    <main class="main">
      <div class="topbar"><button class="menu-toggle"><i class="fa-solid fa-bars"></i></button><h1 class="page-title">Manage activities</h1></div>
      <div class="page-content">
        <!-- activity tabs -->
        <div class="admin-tabs" id="activityTabs">
          <button class="active" data-tab="active">Active <span class="mw-badge mw-badge-teal ms-2" id="activeCount">0</span></button>
          <button data-tab="ended">Ended <span class="mw-badge mw-badge-amber ms-2" id="endedCount">0</span></button>
          <button data-tab="all">All <span class="mw-badge mw-badge-navy ms-2" id="totalCount">0</span></button>
        </div>
        <div class="panel">
          <div class="review-toolbar">
            <div class="search"><i class="fa-solid fa-search"></i><input id="q" class="form-control" placeholder="Search activities…"></div>
            <!-- create btn -->
            <button id="createBtn" class="btn btn-teal"><i class="fa-solid fa-plus me-2"></i>Create activity</button>
          </div>

          <div class="activity-table-section" data-section="active">
            <div class="panel-header"><h3>Active activities</h3></div>
            <div class="table-responsive">
              <!-- table -->
              <table class="mw-table">
                <thead><tr><th>Title</th><th>Meeting point</th><th>Severity</th><th>Time</th><th>Status</th><th>Volunteers</th><th>Actions</th></tr></thead>
                <!-- active rows -->
                <tbody id="activeRows"></tbody>
              </table>
            </div>
          </div>

          <div class="activity-table-section" data-section="ended" hidden>
            <div class="panel-header"><h3>Ended activities</h3></div>
            <div class="table-responsive">
              <!-- table -->
              <table class="mw-table">
                <thead><tr><th>Title</th><th>Meeting point</th><th>Severity</th><th>Time</th><th>Status</th><th>Volunteers</th><th>Actions</th></tr></thead>
                <!-- ended rows -->
                <tbody id="endedRows"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/dashboard.js"></script>
  <script src="../js/admin-activities.js"></script>
</body>
</html>
