<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report details · MarineWatch</title>
  <link rel="icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link href="../css/dashboard.css" rel="stylesheet">
  <link href="../css/admin.css" rel="stylesheet">
  <link href="../css/reports.css" rel="stylesheet">
  <link href="../css/responsive.css" rel="stylesheet">
</head>
<body data-sb="report-details">
  <div class="app-shell">
    <div data-include="components/sidebar-auto.html"></div>
    <!-- main content -->
    <main class="main report-detail-page">
      <div class="topbar">
        <button class="menu-toggle"><i class="fa-solid fa-bars"></i></button>
        <h1 class="page-title">Report details</h1>
        <div class="top-actions">
          <a href="my-reports.html" class="btn btn-ghost" aria-label="Back to reports"><i class="fa-solid fa-arrow-left"></i></a>
        </div>
      </div>
      <div class="page-content">
        <div class="review-detail-grid">
          <div>
            <div class="panel">
              <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                <div><h2 id="rTitle" style="margin:0">Loading…</h2><small id="rMeta" class="text-muted-2"></small></div>
                <!-- r badges -->
                <div id="rBadges"></div>
              </div>
              <h4 class="mt-3">Description</h4>
              <!-- r desc -->
              <p class="text-muted-2" id="rDesc"></p>
              <div class="detail-meta-grid">
                <div class="m-item"><div class="l">Type</div><div class="v" id="rType">—</div></div>
                <div class="m-item"><div class="l">Severity</div><div class="v" id="rSev">—</div></div>
                <div class="m-item"><div class="l">ESI score</div><div class="v" id="rEsi">—</div></div>
                <div class="m-item"><div class="l">Location</div><div class="v" id="rLoc">Location unavailable</div></div>
                <div class="m-item"><div class="l">Date observed</div><div class="v" id="rDate">—</div></div>
              </div>
              <h4 class="mt-3">Photos</h4>
              <div class="gallery mt-3 report-gallery"></div>
              <!-- image preview overlay -->
              <div id="imagePreviewOverlay" class="image-preview-overlay" hidden>
                <div class="image-preview-frame">
                  <button type="button" class="image-preview-close btn btn-sm btn-outline-light"><i class="fa-solid fa-times"></i></button>
                  <!-- image preview image -->
                  <img id="imagePreviewImage" src="" alt="Preview" />
                </div>
              </div>
            </div>
          </div>

          <div>
            <div class="panel mb-3">
              <h3>Location</h3>
              <!-- r map -->
              <div id="rMap" class="report-map"></div>
              <div class="mt-2"><span class="mw-badge mw-badge-blue" id="coord">Location unavailable</span></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/report-details-utils.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/dashboard.js"></script>
  <script src="../js/report-details.js"></script>
</body>
</html>
