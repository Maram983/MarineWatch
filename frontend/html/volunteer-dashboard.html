<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volunteer dashboard · MarineWatch</title>
  <link rel="icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet"><link href="../css/dashboard.css" rel="stylesheet"><link href="../css/responsive.css" rel="stylesheet">
</head>
<body data-sb="dashboard">
  <div class="app-shell">
    <div data-include="components/sidebar-volunteer.html"></div>
    <!-- main content -->
    <main class="main">
      <div class="topbar">
        <button class="menu-toggle"><i class="fa-solid fa-bars"></i></button>
        <h1 class="page-title">Dashboard</h1>
        <div class="top-actions">
          <a href="activities.html" class="btn btn-primary"><i class="fa-solid fa-plus me-1"></i>Find activities</a>
          <a href="volunteer-profile.html" class="user-chip"><span class="avatar" id="topUserAvatar" style="background:#00A7B5">U</span><span class="d-none d-md-inline" id="topUserName">User</span></a>
        </div>
      </div>

      <div class="page-content">
        <div class="dash-hero">
          <h2>Welcome back, <span id="welcomeUserName">User</span> 🌊</h2>
        </div>

        <div class="stats-grid">
          <div class="stat-card"><div class="icon teal"><i class="fa-solid fa-hands-holding-circle"></i></div><div><div class="label">Activities joined</div><div class="value" id="volunteerJoinedCount">0</div><div class="delta">Live from your account</div></div></div>
          <div class="stat-card"><div class="icon blue"><i class="fa-solid fa-clock"></i></div><div><div class="label">Volunteer hours</div><div class="value" id="volunteerHoursCount">0</div><div class="delta">Live from your account</div></div></div>
          <div class="stat-card"><div class="icon amber"><i class="fa-solid fa-calendar"></i></div><div><div class="label">Upcoming</div><div class="value" id="volunteerUpcomingCount">0</div><div class="delta">Live from your account</div></div></div>
        </div>

        <div class="dash-grid">
          <div class="panel summary-panel">
            <div class="panel-header"><h3>Volunteer summary</h3></div>
            <div class="summary-chart-shell">
              <!-- v chart -->
              <canvas id="vChart"></canvas>
            </div>
          </div>
          <div class="panel quick-actions-panel">
            <div class="panel-header"><h3>Quick actions</h3></div>
            <div class="quick-actions">
              <a class="qa-item" href="activities.html"><span class="icn"><i class="fa-solid fa-search"></i></span>Find activity</a>
              <a class="qa-item" href="joined-activities.html"><span class="icn"><i class="fa-solid fa-list-check"></i></span>My activities</a>
              <a class="qa-item" href="map.html"><span class="icn"><i class="fa-solid fa-map-location-dot"></i></span>Marine map</a>
            </div>
          </div>
        </div>

    
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/dashboard.js"></script>
  <script src="../js/volunteer-dashboard.js"></script>
</body>
</html>
