<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diver Dashboard · MarineWatch</title>

  <link rel="icon" href="favicon.ico">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">

  <link href="../css/style.css" rel="stylesheet">
  <link href="../css/dashboard.css" rel="stylesheet">
  <link href="../css/responsive.css" rel="stylesheet">
</head>

<body data-sb="dashboard">

<div class="app-shell">

    <div data-include="components/sidebar-diver.html"></div>

    <!-- main content -->
    <main class="main">

        <!-- Top Bar -->
        <div class="topbar">

            <button class="menu-toggle">
                <i class="fa-solid fa-bars"></i>
            </button>

            <h1 class="page-title">
                Dashboard
            </h1>

            <div class="top-actions">

                <a href="submit-report.html" class="btn btn-primary">
                    <i class="fa-solid fa-plus me-1"></i>
                    New Report
                </a>

            </div>

        </div>

        <div class="page-content">

            <!-- Welcome -->
            <div class="dash-hero fade-in-up">

                <h2>Welcome back!</h2>

                <!-- dash hero message -->
                <p id="dashHeroMessage">
                    Loading your report summary…
                </p>

            </div>

            <!-- Statistics -->

            <div class="stats-grid fade-in-up delay-1">

                <div class="stat-card">
                    <div class="icon blue">
                        <i class="fa-solid fa-file-lines"></i>
                    </div>

                    <div>
                        <div class="label">Total Reports</div>
                        <!-- diver total reports -->
                        <div class="value" id="diverTotalReports">0</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="icon green">
                        <i class="fa-solid fa-check"></i>
                    </div>

                    <div>
                        <div class="label">Approved</div>
                        <!-- diver approved reports -->
                        <div class="value" id="diverApprovedReports">0</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="icon amber">
                        <i class="fa-solid fa-clock"></i>
                    </div>

                    <div>
                        <div class="label">Pending</div>
                        <!-- diver pending reports -->
                        <div class="value" id="diverPendingReports">0</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="icon teal">
                        <i class="fa-solid fa-water"></i>
                    </div>

                    <div>
                        <div class="label">Dives</div>
                        <!-- diver dives count -->
                        <div class="value" id="diverDivesCount">0</div>
                    </div>
                </div>

            </div>

            <!-- Reports + Map -->

            <div class="dash-grid fade-in-up delay-2">

                <!-- Reports -->

                <div class="panel dashboard-side-panel">

                    <div class="panel-header">

                        <h3>Recent Reports</h3>

                        <a href="my-reports.html" class="link">
                            View all
                        </a>

                    </div>

                    <div class="table-responsive">

                        <!-- table -->
                        <table class="mw-table">

                            <thead>

                            <tr>

                                <th>Title</th>
                                <th>Type</th>
                                <th>Severity</th>
                                <th>Status</th>
                                <th>Date</th>

                            </tr>

                            </thead>

                            <!-- recent reports -->
                            <tbody id="recentReports">

                            </tbody>

                        </table>

                    </div>

                </div>

                <!-- Map -->

                <div class="panel dashboard-side-panel">

                    <div class="panel-header">

                        <h3>Nearby Hotspots</h3>

                        <a href="map.html" class="link">
                            Full map
                        </a>

                    </div>

                    <!-- dash map -->
                    <div id="dashMap" class="map-preview"></div>

                </div>

            </div>

        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="../js/main.js"></script>
<script src="../js/dashboard.js"></script>
<script src="../js/diver-dashboard.js"></script>

</body>
</html>
