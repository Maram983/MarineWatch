<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My activities · MarineWatch</title>
  <link rel="icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet"><link href="../css/dashboard.css" rel="stylesheet"><link href="../css/activities.css" rel="stylesheet"><link href="../css/responsive.css" rel="stylesheet">
</head>
<body data-sb="joined">
  <div class="app-shell">
<div data-include="components/sidebar-auto.html"></div>
    <!-- main content -->
    <main class="main">
      <div class="topbar"><button class="menu-toggle"><i class="fa-solid fa-bars"></i></button><h1 class="page-title">My activities</h1></div>
      <div class="page-content">
        <!-- tabs -->
        <div class="admin-tabs" id="tabs" style="display:flex;gap:4px;margin-bottom:1.25rem;background:#fff;padding:4px;border-radius:12px;border:1px solid var(--mw-border);width:fit-content">
          <button class="active" data-tab="upcoming">Upcoming</button>
          <button data-tab="past">Completed</button>
          <button data-tab="cancelled">Cancelled</button>
        </div>
        <!-- grid -->
        <div class="activities-grid" id="grid"></div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/joined-activities.js"></script>
</body>
</html>
