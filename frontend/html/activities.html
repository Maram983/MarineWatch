<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activities · MarineWatch</title>
  <link rel="icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet"><link href="../css/dashboard.css" rel="stylesheet"><link href="../css/activities.css" rel="stylesheet"><link href="../css/reports.css" rel="stylesheet"><link href="../css/responsive.css" rel="stylesheet">
</head>
<body data-sb="activities">
  <div class="app-shell">
<div data-include="components/sidebar-auto.html"></div>
    <!-- main content -->
    <main class="main">
      <div class="topbar"><button class="menu-toggle"><i class="fa-solid fa-bars"></i></button><h1 class="page-title">Browse activities</h1></div>
      <div class="page-content">
        <div class="panel mb-3">
          <div class="reports-toolbar">
            <div class="search"><i class="fa-solid fa-search"></i><input id="q" class="form-control" placeholder="Search by area…"></div>
            <div class="reports-toolbar-selects">
              <!-- f type -->
              <select id="fType" class="form-select"><option value="">All types</option><option>Cleanup</option><option>Awareness</option><option>Survey</option><option>Training</option></select>
              <!-- f status -->
              <select id="fStatus" class="form-select"><option value="">All</option><option value="open">Open</option><option value="filling">Filling fast</option><option value="closed">Closed</option></select>
            </div>
          </div>
        </div>
        <!-- grid -->
        <div class="activities-grid" id="grid"></div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/activities.js"></script>
</body>
</html>
