<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volunteers · MarineWatch admin</title>
  <link rel="icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet"><link href="../css/dashboard.css" rel="stylesheet"><link href="../css/admin.css" rel="stylesheet"><link href="../css/reports.css" rel="stylesheet"><link href="../css/responsive.css" rel="stylesheet">
</head>
<body data-sb="volunteers">
  <div class="app-shell">
    <div data-include="components/sidebar-admin.html"></div>
    <!-- main content -->
    <main class="main">
      <div class="topbar"><button class="menu-toggle"><i class="fa-solid fa-bars"></i></button><h1 class="page-title">Volunteers</h1></div>
      <div class="page-content">
        <div class="stats-grid" style="grid-template-columns:repeat(4,1fr)">
          <div class="stat-card"><div class="icon teal"><i class="fa-solid fa-hands-holding-circle"></i></div><div><div class="label">Total volunteers</div><div class="value">3,127</div></div></div>
          <div class="stat-card"><div class="icon green"><i class="fa-solid fa-check"></i></div><div><div class="label">Active this month</div><div class="value">1,842</div></div></div>
          <div class="stat-card"><div class="icon blue"><i class="fa-solid fa-clock"></i></div><div><div class="label">Hours logged</div><div class="value">18,530</div></div></div>
          <div class="stat-card"><div class="icon amber"><i class="fa-solid fa-calendar-check"></i></div><div><div class="label">Activities (30d)</div><div class="value">36</div></div></div>
        </div>
        <div class="panel">
          <div class="review-toolbar">
            <div class="search"><i class="fa-solid fa-search"></i><input id="q" class="form-control" placeholder="Search volunteers…"></div>
            <!-- f status -->
            <select id="fStatus" class="form-select" style="max-width:180px"><option value="">All statuses</option><option value="active">Active</option><option value="pending">Pending</option><option value="suspended">Suspended</option></select>
          </div>
          <div class="table-responsive"><table class="mw-table"><thead><tr><th>Volunteer</th><th>Role</th><th>City</th><th>Reports</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/users.js"></script>
  <script>document.addEventListener('mw:ready',()=>MW_USER_RENDER('volunteer'));</script>
</body>
</html>
