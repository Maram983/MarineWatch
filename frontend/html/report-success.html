<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report submitted · MarineWatch</title>
  <link rel="icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link href="../css/dashboard.css" rel="stylesheet">
  <link href="../css/reports.css" rel="stylesheet">
  <link href="../css/responsive.css" rel="stylesheet">
</head>
<body data-sb="submit">
  <div class="app-shell">
    <div data-include="components/sidebar-auto.html"></div>
    <!-- main content -->
    <main class="main">
      <div class="topbar">
        <button class="menu-toggle"><i class="fa-solid fa-bars"></i></button>
        <h1 class="page-title">Report submitted</h1>
      </div>
      <div class="success-wrap">
        <div class="success-card">
          <div class="success-ring"><i class="fa-solid fa-check"></i></div>
          <h2>Thank you for reporting.</h2>
          <p class="text-muted-2">Your report has been queued for administrator review. You'll be notified as soon as it is verified and published to the public marine map.</p>
          <div class="mw-card bg-foam mt-4 text-start">
            <div class="d-flex justify-content-between"><span class="text-muted-2">Reference</span><strong id="refId">R-2482</strong></div>
            <div class="d-flex justify-content-between mt-2"><span class="text-muted-2">Status</span><span class="mw-badge mw-badge-amber">Pending review</span></div>
            <div class="d-flex justify-content-between mt-2"><span class="text-muted-2">Estimated review</span><strong>&lt; 24h</strong></div>
          </div>
          <div class="d-flex gap-2 justify-content-center mt-4">
            <a href="my-reports.html" class="btn btn-outline-navy">My reports</a>
            <a href="submit-report.html" class="btn btn-primary">Submit another</a>
            <a href="diver-dashboard.html" class="btn btn-ghost">Back to dashboard</a>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script>document.getElementById('refId').textContent = 'R-' + (2482 + Math.floor(Math.random()*20));</script>
</body>
</html>
