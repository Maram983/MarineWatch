<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Edit Profile · MarineWatch</title>

    <link rel="icon" href="favicon.ico">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          rel="stylesheet">

    <link href="../css/style.css"
          rel="stylesheet">

    <link href="../css/dashboard.css"
          rel="stylesheet">

    <link href="../css/profile.css"
          rel="stylesheet">

    <link href="../css/responsive.css"
          rel="stylesheet">

</head>

<body>

<div class="app-shell">

    <div data-include="components/sidebar-volunteer.html"></div>

    <!-- main content -->
    <main class="main">

        <div class="topbar">

            <button class="menu-toggle">

                <i class="fa-solid fa-bars"></i>

            </button>

            <h1 class="page-title">

                Edit Profile

            </h1>

        </div>

        <div class="page-content">

            <!-- profile form -->
            <form id="profileForm">

                <!-- Contact Information -->

                <div class="edit-profile-card edit-section">

                    <h3 class="edit-card-title">

                        <i class="fa-solid fa-address-card"></i>

                        Contact Information

                    </h3>

                    <div class="row g-4">

                        <div class="col-md-6">

                            <label class="form-label">

                                Full Name

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="fullName">

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">

                                Email Address

                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email">

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">

                                Phone Number

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="phone">

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">

                                City

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="city">

                        </div>

                    </div>

                </div>

                <!-- Change Password -->

                <div class="edit-profile-card edit-section">

                    <h3 class="edit-card-title">

                        <i class="fa-solid fa-lock"></i>

                        Change Password

                    </h3>

                    <div class="info-note mb-4">

                        Leave these fields empty if you don't want to change your password.

                    </div>

                    <div class="row g-4">

                        <div class="col-md-4">

                            <label class="form-label">

                                Current Password

                            </label>

                            <input
                                type="password"
                                id="currentPassword"
                                class="form-control">

                        </div>

                        <div class="col-md-4">

                            <label class="form-label">

                                New Password

                            </label>

                            <input
                                type="password"
                                id="newPassword"
                                class="form-control">

                        </div>

                        <div class="col-md-4">

                            <label class="form-label">

                                Confirm Password

                            </label>

                            <input
                                type="password"
                                id="confirmPassword"
                                class="form-control">

                        </div>

                    </div>

                </div>

                <!-- Actions -->

                <div class="edit-actions">

                    <a
                        href="volunteer-profile.html"
                        class="btn btn-outline-secondary">

                        Cancel

                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary save-btn">

                        <i class="fa-solid fa-floppy-disk me-2"></i>

                        Save Changes

                    </button>

                </div>

            </form>

        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/main.js"></script>

<script src="../js/dashboard.js"></script>

<script src="../js/edit-profile.js"></script>

</body>

</html>
